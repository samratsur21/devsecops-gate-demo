name: Security gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:

  secrets:
      secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan working tree
        run: gitleaks detect --source. --no-git -c .gitleaks.toml --redact -v

      - name: Scan full git history
        if: always()
        run: gitleaks detect --source. -c .gitleaks.toml --redact -v --log-opts="--all"

  dependencies:
    name: Dependency and image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Scan dependencies and image (blocking)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: demo-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true     # don't block on CVEs with no available patch
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Scan again for the record (non-blocking, full severity range)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: demo-app:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  iac:
    name: IaC misconfiguration scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          soft_fail: false
          # Only these checks block. Everything else is reported, not enforced.
          check: CKV_AWS_16,CKV_AWS_17,CKV_AWS_24,CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  evidence:
    name: Retain evidence
    needs: [secrets, dependencies, iac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record gate outcome
        run: |
          cat > gate-evidence.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gates": {
              "secret_scan": "${{ needs.secrets.result }}",
              "dependency_scan": "${{ needs.dependencies.result }}",
              "iac_scan": "${{ needs.iac.result }}"
            }
          }
          EOF
          cat gate-evidence.json

      - uses: actions/upload-artifact@v4
        with:
          name: security-gate-evidence-${{ github.run_id }}
          path: gate-evidence.json
          retention-days: 400     # exceeds a 12-month audit cycle
